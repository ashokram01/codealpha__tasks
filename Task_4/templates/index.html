<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot Interface</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 400px; background: white; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); overflow: hidden; }
        .chat-header { background: #007bff; color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; }
        .chat-box { height: 400px; padding: 15px; overflow-y: auto; background: #f9f9f9; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 15px; border-radius: 20px; max-width: 80%; word-wrap: break-word; }
        .bot-msg { background: #e0e0e0; color: #333; align-self: flex-start; border-bottom-left-radius: 2px; }
        .user-msg { background: #007bff; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .input-area { display: flex; border-top: 1px solid #ddd; }
        .input-area input { flex: 1; padding: 15px; border: none; outline: none; font-size: 14px; }
        .input-area button { padding: 15px 20px; background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        .input-area button:hover { background: #0056b3; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🌐 CloudSec AI Support</div>
    <div class="chat-box" id="chat-box">
        <div class="message bot-msg">Hello! Welcome to CloudSec Support. How can I help you today?</div>
    </div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Type your message here..." autocomplete="off">
        <button id="send-btn">Send</button>
    </div>
</div>

<script>
    $(document).ready(function(){
        function sendMessage() {
            var userText = $("#user-input").val().trim();
            if(userText === "") return;
            
            // Append user message
            $("#chat-box").append('<div class="message user-msg">' + userText + '</div>');
            $("#user-input").val("");
            scrollToBottom();

            // Send to Flask backend
            $.ajax({
                url: "/get",
                type: "POST",
                data: { msg: userText },
                success: function(data) {
                    setTimeout(function() {
                        $("#chat-box").append('<div class="message bot-msg">' + data.response + '</div>');
                        scrollToBottom();
                    }, 500); // Small delay for realistic feel
                }
            });
        }

        $("#send-btn").click(function(){
            sendMessage();
        });

        $("#user-input").keypress(function(e){
            if(e.which == 13) { sendMessage(); }
        });

        function scrollToBottom() {
            $("#chat-box").scrollTop($("#chat-box")[0].scrollHeight);
        }
    });
</script>
</body>
</html>
